apiVersion: v1
kind: Service
metadata:
  name: web-server
  namespace: ambient-lab
  labels:
    app: web-server
spec:
  ports:
  - port: 80
    name: http
  selector:
    app: web-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
  namespace: ambient-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-server
  template:
    metadata:
      labels:
        app: web-server
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sleep-client
  namespace: ambient-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sleep-client
  template:
    metadata:
      labels:
        app: sleep-client
    spec:
      containers:
      - name: sleep
        image: curlimages/curl
        command: ["/bin/sh", "-c", "sleep 365d"]
